name: Build & deploy
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install pnpm -g && pnpm install && pnpm build
      - run: bun scripts/deploy.ts
      - run: sleep 3s
      - run: |
          ls _site
          npx surge --project ./_site --domain tdesign-starter-cli.surge.sh --token ${{ secrets.TDESIGN_SURGE_TOKEN }}
