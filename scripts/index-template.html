<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDesign Starter Templates</title>
  <style>
    :root {
      --td-brand-color-1: #f2f3ff;
      --td-brand-color-2: #d9e1ff;
      --td-brand-color-6: #366ef4;
      --td-brand-color-7: #0052d9;
      --td-brand-color-8: #003cab;
      --td-text-color-primary: #181818;
      --td-text-color-secondary: #5a5a5a;
      --td-text-color-placeholder: #a6a6a6;
      --td-border-color: #dcdcdc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: var(--td-text-color-primary);
      display: flex;
    }
    .sidebar {
      width: 240px;
      min-width: 240px;
      height: 100vh;
      border-right: 1px solid var(--td-border-color);
      padding: 24px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .logo { font-size: 18px; font-weight: 700; color: var(--td-brand-color-7); margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: var(--td-text-color-placeholder); margin-bottom: 24px; }
    .group { margin-bottom: 20px; }
    .group-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--td-text-color-placeholder);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }
    .btn-list { display: flex; flex-direction: column; gap: 6px; }
    .btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      background: #f6f7f9;
      color: var(--td-text-color-primary);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 6px;
      border: 1px solid transparent;
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: all .15s ease;
    }
    .btn:hover {
      background: var(--td-brand-color-1);
      border-left-color: var(--td-brand-color-6);
      color: var(--td-brand-color-7);
    }
    .btn.active {
      background: var(--td-brand-color-7);
      color: #fff;
      border-color: var(--td-brand-color-7);
      border-left-color: var(--td-brand-color-7);
      box-shadow: 0 2px 8px rgba(0, 82, 217, .25);
    }
    .btn .fw-label {
      margin-left: auto;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
      font-weight: 600;
    }
    .btn .fw-label.vue3, .btn .fw-label.vue2 { background: rgba(66, 184, 131, .12); color: #2a8c5e; }
    .btn .fw-label.react { background: rgba(97, 218, 251, .15); color: #1a7a9c; }
    .btn.active .fw-label.vue3, .btn.active .fw-label.vue2,
    .btn.active .fw-label.react { background: rgba(255,255,255,.2); color: #fff; }
    .fw-icon {
      display: inline-block;
      width: 20px; height: 20px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      line-height: 20px;
      text-align: center;
      color: #fff;
      flex-shrink: 0;
    }
    .fw-icon.vue3, .fw-icon.vue2 { background: #42b883; }
    .fw-icon.react { background: #61dafb; color: #222; }
    .footer { margin-top: auto; padding-top: 16px; font-size: 11px; color: var(--td-text-color-placeholder); text-align: center; }
    .main { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    .toolbar {
      height: 44px;
      min-height: 44px;
      border-bottom: 1px solid var(--td-border-color);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }
    .current-name { font-size: 13px; font-weight: 500; color: var(--td-text-color-secondary); }
    .open-link { margin-left: auto; font-size: 12px; color: var(--td-brand-color-7); text-decoration: none; }
    .open-link:hover { text-decoration: underline; }
    .preview-frame { flex: 1; width: 100%; border: none; height: 100%; }
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--td-text-color-placeholder);
      font-size: 14px;
    }
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: #fff;
      z-index: 10;
    }
    .loading-overlay.visible { display: flex; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--td-brand-color-1);
      border-top-color: var(--td-brand-color-7);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .loading-text { font-size: 13px; color: var(--td-text-color-placeholder); }
    .loading-spinner { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
    .loading-spinner.hidden { display: none; }
    .loading-error {
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }
    .loading-error.visible { display: flex; }
    .loading-error .error-icon { font-size: 36px; line-height: 1; }
    .loading-error .error-text { font-size: 13px; color: var(--td-text-color-secondary); }
    .retry-btn {
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--td-brand-color-7);
      background: var(--td-brand-color-1);
      border: 1px solid var(--td-brand-color-6);
      border-radius: 4px;
      cursor: pointer;
      transition: all .15s ease;
    }
    .retry-btn:hover { background: var(--td-brand-color-7); color: #fff; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">TDesign Starter</div>
    <div class="subtitle">Template Preview</div>
    {{SIDEBAR_CONTENT}}
    <div class="footer">Powered by TDesign Starter CLI</div>
  </aside>
  <main class="main">
    <div class="toolbar">
      <span class="current-name" id="currentName">Select a template</span>
      <a class="open-link" id="openLink" href="#" target="_blank" style="display:none">Open in new tab &#8599;</a>
    </div>
    <div style="flex:1;position:relative">
      <div class="empty-state" id="emptyState">&#8592; Choose a template from the left to preview</div>
      <iframe class="preview-frame" id="previewFrame" style="display:none"></iframe>
      <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner" id="loadingSpinner">
          <div class="spinner"></div>
          <div class="loading-text">Loading template...</div>
        </div>
        <div class="loading-error" id="loadingError">
          <div class="error-icon">&#9888;</div>
          <div class="error-text">Failed to load template</div>
          <button class="retry-btn" id="retryBtn">Retry</button>
        </div>
      </div>
    </div>
  </main>
  <script>
    const buttons = document.querySelectorAll('.btn[data-template]');
    const frame = document.getElementById('previewFrame');
    const emptyState = document.getElementById('emptyState');
    const currentName = document.getElementById('currentName');
    const openLink = document.getElementById('openLink');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const loadingError = document.getElementById('loadingError');
    const retryBtn = document.getElementById('retryBtn');
    const LOAD_TIMEOUT = 15000;
    let loadTimer = null;

    function hideLoading() {
      if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; }
      loadingOverlay.classList.remove('visible');
      loadingError.classList.remove('visible');
      loadingSpinner.classList.remove('hidden');
    }

    frame.addEventListener('load', () => hideLoading());

    retryBtn.addEventListener('click', () => {
      loadingError.classList.remove('visible');
      loadingSpinner.classList.remove('hidden');
      if (frame.src) { frame.src = frame.src; }
    });

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const template = btn.dataset.template;
        const url = './' + template + '/';
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        hideLoading();
        loadingOverlay.classList.add('visible');
        loadTimer = setTimeout(() => {
          loadingSpinner.classList.add('hidden');
          loadingError.classList.add('visible');
        }, LOAD_TIMEOUT);
        frame.src = url;
        frame.style.display = 'block';
        emptyState.style.display = 'none';
        currentName.textContent = template;
        openLink.href = url;
        openLink.style.display = 'inline';
      });
    });
  </script>
</body>
</html>
